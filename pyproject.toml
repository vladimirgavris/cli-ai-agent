[project]
name = "cli-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "boai1", email = "bogdanaioanei1@yahoo.com" },
    { name = "vladimirgavris", email = "vladimirgavris80@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
cli-ai-agent = "cli_ai_agent:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
